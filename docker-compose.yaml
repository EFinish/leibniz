version: "3.9"  # optional since v1.27.0
services:
  mongo:
    image: mongo
    ports: 
      - 27017:27017
    networks:
      - leibniz-local

  mongo-seed:
    build: ./mongo-seed
    depends_on:
      - mongo
    networks:
      - leibniz-local

  argument-access:
    build:
      context: .
      dockerfile: be/Dockerfile
    init: true
    command: sh -c "git config --global --add safe.directory /app && cd ./be/services/argument-access && air"
    env_file:
        - ././be/services/argument-access/.env.prod
    ports:
      - "9102:9102"
    volumes:
      - ./:/app
      - /root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    networks:
      - leibniz-local
    depends_on:
      - mongo

  argument-manager:
    build:
      context: .
      dockerfile: be/Dockerfile
    init: true
    command: sh -c "git config --global --add safe.directory /app && cd ./be/services/argument-access && air"
    env_file:
        - ././be/services/argument-manager/.env.prod
    ports:
      - "9002:9002"
      - "9000:9000"
    volumes:
      - ./:/app
      - /root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    networks:
      - leibniz-local
    depends_on:
      - mongo

  fe:
    build:
      context: .
      dockerfile: fe/Dockerfile
    command: sh -c "cd ./fe && npm run start -- --host"
    ports:
      - "3000:3000"
    networks:
      - leibniz-local
    volumes:
      - ./fe:/usr/src/app

volumes:
  go-mod-cache:

networks:
  leibniz-local:
